[package]
name = "dcbench"
version = "0.2.0"
description = "DC Bench — dimensional control survey software"
edition = "2021"

[lib]
name = "dcbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-serialplugin = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
